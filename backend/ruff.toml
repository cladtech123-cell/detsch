# Ruff configuration (lint + format)
target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # Depends calls in FastAPI defaults
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[format]
quote-style = "double"
indent-style = "space"
